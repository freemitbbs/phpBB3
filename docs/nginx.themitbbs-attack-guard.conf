# Install in /etc/nginx/conf.d/themitbbs-attack-guard.conf (http context).
# Every filtered homepage shares this key, regardless of IP, browser, forum
# selection, pagination, or other query parameters. An empty key is uncounted.
map "$uri:$arg_ff" $themitbbs_expensive_home_key {
    default "";
    ~^/(?:index\.php(?:/.*)?)?:.+$ themitbbs_filtered_home;
}

limit_req_zone $themitbbs_expensive_home_key
    zone=themitbbs_filtered_home_rate:1m rate=5r/s;
limit_conn_zone $themitbbs_expensive_home_key
    zone=themitbbs_filtered_home_concurrency:1m;

map "$themitbbs_expensive_home_key:$status" $themitbbs_attack_retry_after {
    default "";
    "themitbbs_filtered_home:429" "1";
}
