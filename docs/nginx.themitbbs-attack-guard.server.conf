# Include in themitbbs's HTTPS server block, not in other virtual hosts.
# These are aggregate limits for filtered homepage requests, not per IP.
limit_req zone=themitbbs_filtered_home_rate burst=5 nodelay;
limit_req_status 429;
limit_req_log_level warn;

# Half the current www pool's pm.max_children = 64.
limit_conn themitbbs_filtered_home_concurrency 32;
limit_conn_status 429;
limit_conn_log_level warn;

add_header Retry-After $themitbbs_attack_retry_after always;
