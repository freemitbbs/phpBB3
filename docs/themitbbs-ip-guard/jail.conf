[themitbbs-expensive-home]
enabled = true
filter = themitbbs-expensive-home
backend = polling
usedns = no
logpath = /var/log/nginx/themitbbs.abuse.log
findtime = 10m
maxretry = 30
bantime = 10m
bantime.increment = true
bantime.factor = 1
bantime.multipliers = 1 6 36 144 1008 4320
bantime.maxtime = 30d
bantime.overalljails = false
bantime.rndtime = 0
action = themitbbs-cloudflare
# Installer adds Cloudflare ranges, the origin address, and optional admin IPs.
ignoreip = 127.0.0.0/8 ::1 159.195.12.16
