# Include only in the themitbbs HTTPS server. The generated list trusts the
# published Cloudflare networks, never arbitrary clients or forwarded headers.
include /etc/nginx/snippets/themitbbs-cloudflare-realip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
access_log /var/log/nginx/themitbbs.abuse.log themitbbs_abuse if=$themitbbs_log_abuse;
