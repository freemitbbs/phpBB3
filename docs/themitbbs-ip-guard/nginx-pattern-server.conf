# Include only in themitbbs's HTTPS server. Return before PHP/rate limiting.
if ($themitbbs_pattern_block) {
    return 403;
}

# Adds a second server-level rate budget alongside the existing filtered-home
# limit. Both directives remain in the same context; each has its own key.
limit_req zone=themitbbs_pattern_home_rate burst=3 nodelay;
