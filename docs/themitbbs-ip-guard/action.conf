[Definition]
# Credentials stay in a root-only file, never in command arguments or logs.
actionstart = /usr/local/sbin/themitbbs-cloudflare-ban check
actionban = /usr/local/sbin/themitbbs-cloudflare-ban ban '<ip>' '<time>' '<bantime>'
actionprolong = /usr/local/sbin/themitbbs-cloudflare-ban ban '<ip>' '<time>' '<bantime>'
actionunban = /usr/local/sbin/themitbbs-cloudflare-ban unban '<ip>'

[Init]
timeout = 120
