# Temporary incident rule: the exact browser strings seen in the current
# distributed attack. This is a traffic heuristic, not client authentication.
map $http_user_agent $themitbbs_pattern_browser {
    default 0;
    "~^Mozilla/5[.]0 [(]Windows NT 10[.]0; Win64; x64[)] AppleWebKit/537[.]36 [(]KHTML, like Gecko[)] Chrome/151[.]0[.]0[.]0 Safari/537[.]36$" 1;
    "~^Mozilla/5[.]0 [(]X11; Linux x86_64[)] AppleWebKit/537[.]36 [(]KHTML, like Gecko[)] Chrome/146[.]0[.]0[.]0 Safari/537[.]36$" 1;
    "~^Mozilla/5[.]0 [(]Macintosh; Intel Mac OS X 10[.]15; rv:135[.]0[)] Gecko/20100101 Firefox/135[.]0$" 2;
}

# Every condition must match: GET filtered homepage, explicit merged/classic
# preferences, an observed browser string, and no Referer header.
map "$request_method:$themitbbs_expensive_home_key:$arg_toptopics_home:$arg_toptopics_view:$themitbbs_pattern_browser:$http_referer" $themitbbs_pattern_block {
    default 0;
    "GET:themitbbs_filtered_home:merged:classic:1:" 1;
}

# The newer burst uses the unfiltered homepage and one Firefox string. Share
# its budget across every source IP. Empty keys leave other traffic uncounted.
map "$request_method:$uri:$args:$themitbbs_pattern_browser:$http_referer" $themitbbs_pattern_home_key {
    default "";
    "~^GET:/(?:index[.]php)?::2:$" themitbbs_pattern_home;
}
limit_req_zone $themitbbs_pattern_home_key
    zone=themitbbs_pattern_home_rate:1m rate=1r/s;
