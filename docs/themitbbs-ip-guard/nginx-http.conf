# HTTP context. Only count rejections arriving through a trusted Cloudflare peer.
geo $realip_remote_addr $themitbbs_cloudflare_peer {
    default 0;
    include /etc/nginx/snippets/themitbbs-cloudflare-geo.conf;
}
map "$themitbbs_expensive_home_key:$status:$themitbbs_cloudflare_peer" $themitbbs_log_abuse {
    default 0;
    "themitbbs_filtered_home:429:1" 1;
}
# No request text or supplied headers appear in the ban input.
log_format themitbbs_abuse '$time_iso8601 client=$remote_addr status=$status reason=filtered_home_limit peer=$realip_remote_addr';
