{% INCLUDECSS '@freemitbbs_cardgamesauth/cardgames_client.css' %}

<!-- INCLUDE overall_header.html -->

<script>
	window.freemitbbsCardGames = {CARDGAMES_BOOTSTRAP_JSON};
</script>

<main class="app-shell">
	<section class="topbar">
		<div>
			<h1>{{ lang('CARDGAMES_TRACTOR_TITLE') }}</h1>
			<p id="connection-status">未连接</p>
		</div>
		<div class="userbar">
			<span id="user-label"></span>
			<select id="skin-select" aria-label="皮肤" hidden></select>
			<button id="sound-button" type="button" aria-pressed="false">声音关</button>
			<button id="connect-button" type="button">连接</button>
		</div>
	</section>

	<section class="workspace">
		<aside class="rooms-panel">
			<div class="rooms-titleline">
				<h2>房间</h2>
			</div>
			<div id="rooms-list" class="rooms-list"></div>
		</aside>

		<section class="table-panel">
			<div class="panel-header">
				<h2 id="table-title">大厅</h2>
				<div id="room-deadline-controls" class="room-deadline-controls" hidden></div>
				<button id="leave-room-button" type="button" hidden>离开</button>
			</div>
			<div id="table-view" class="table-view"></div>
			<div id="event-log" class="event-log" aria-live="polite"></div>
			<div id="emoji-panel" class="emoji-panel" hidden>
				<label class="emoji-target-label">
					<span>发送给</span>
					<select id="emoji-target-select" aria-label="表情目标"></select>
				</label>
				<div id="emoji-dock" class="emoji-dock"></div>
			</div>
			<div id="chat-panel" class="chat-panel" hidden>
				<div id="chat-messages" class="chat-messages" aria-live="polite"></div>
				<form id="chat-form" class="chat-form">
					<input id="chat-input" type="text" maxlength="280" autocomplete="off" placeholder="桌内聊天" />
					<button type="submit">发送</button>
				</form>
			</div>
		</section>
	</section>
</main>

{% INCLUDEJS '@freemitbbs_cardgamesauth/js/cardgames_client.js' %}

<!-- INCLUDE overall_footer.html -->
