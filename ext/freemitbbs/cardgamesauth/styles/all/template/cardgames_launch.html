<!-- INCLUDE overall_header.html -->

<h2>{L_CARDGAMES_LAUNCH_HEADING}</h2>

<div class="panel">
	<div class="inner">
		<!-- IF S_CARDGAMES_CAN_PLAY -->
			<p>{L_CARDGAMES_LAUNCH_BODY}</p>
			<!-- IF U_CARDGAMES_CLIENT -->
				<p><a class="button" href="{U_CARDGAMES_CLIENT}" id="cardgames-open-client">{L_CARDGAMES_OPEN_CLIENT}</a></p>
			<!-- ELSE -->
				<p>{L_CARDGAMES_CLIENT_NOT_CONFIGURED}</p>
			<!-- ENDIF -->
			<!-- IF S_CARDGAMES_MANAGE -->
				<p><a class="button" href="{U_CARDGAMES_ADMIN}">{L_CARDGAMES_ADMIN_OPEN}</a></p>
			<!-- ENDIF -->
			<script>
				window.freemitbbsCardGames = {CARDGAMES_BOOTSTRAP_JSON};
			</script>
		<!-- ELSE -->
			<!-- IF S_CARDGAMES_TESTING_MODE -->
				<p>{L_CARDGAMES_TESTING_ONLY}</p>
			<!-- ELSE -->
				<p>{L_CARDGAMES_NOT_ALLOWED}</p>
			<!-- ENDIF -->
		<!-- ENDIF -->
	</div>
</div>

<!-- INCLUDE overall_footer.html -->
