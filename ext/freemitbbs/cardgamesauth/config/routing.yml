freemitbbs_cardgamesauth_launch:
    path: /card-games
    defaults: { _controller: freemitbbs.cardgamesauth.controller.auth:launch }
    methods: [GET]

freemitbbs_cardgamesauth_client:
    path: /card-games/client
    defaults: { _controller: freemitbbs.cardgamesauth.controller.auth:client }
    methods: [GET]

freemitbbs_cardgamesauth_client_slash:
    path: /card-games/client/
    defaults: { _controller: freemitbbs.cardgamesauth.controller.auth:client }
    methods: [GET]

freemitbbs_cardgamesauth_token:
    path: /card-games/token
    defaults: { _controller: freemitbbs.cardgamesauth.controller.auth:token }
    methods: [POST]

freemitbbs_cardgamesauth_config:
    path: /card-games/config
    defaults: { _controller: freemitbbs.cardgamesauth.controller.auth:config }
    methods: [GET]

freemitbbs_cardgamesauth_admin:
    path: /card-games/admin
    defaults: { _controller: freemitbbs.cardgamesauth.controller.moderation:admin }
    methods: [GET, POST]

freemitbbs_cardgamesauth_replay_export:
    path: /card-games/replay/export
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:replay_export_user }
    methods: [GET]

freemitbbs_cardgamesauth_round_log:
    path: /card-games/replay/round-log
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:round_log }
    methods: [GET]

freemitbbs_cardgamesauth_server_ready:
    path: /card-games/server/ready
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:ready }
    methods: [GET]

freemitbbs_cardgamesauth_server_verify:
    path: /card-games/server/auth/verify
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:verify_auth }
    methods: [POST]

freemitbbs_cardgamesauth_server_user_status:
    path: /card-games/server/users/{id}/status
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:user_status }
    requirements:
        id: \d+
    methods: [POST]

freemitbbs_cardgamesauth_server_room_configs:
    path: /card-games/server/room-configs
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:room_configs }
    methods: [GET]

freemitbbs_cardgamesauth_server_recovery_active:
    path: /card-games/server/recovery/active
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:active_recoveries }
    methods: [GET]

freemitbbs_cardgamesauth_server_session_create:
    path: /card-games/server/session
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:create_session }
    methods: [POST]

freemitbbs_cardgamesauth_server_session_update:
    path: /card-games/server/session/{id}
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:update_session }
    requirements:
        id: \d+
    methods: [PATCH]

freemitbbs_cardgamesauth_server_events:
    path: /card-games/server/events
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:events }
    methods: [POST]

freemitbbs_cardgamesauth_server_chat_events:
    path: /card-games/server/chat-events
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:chat_events }
    methods: [POST]

freemitbbs_cardgamesauth_server_events_read:
    path: /card-games/server/events
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:events_read }
    methods: [GET]

freemitbbs_cardgamesauth_server_replay_export:
    path: /card-games/server/replay/export
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:replay_export }
    methods: [GET]

freemitbbs_cardgamesauth_server_snapshots:
    path: /card-games/server/snapshots
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:snapshots }
    methods: [POST]

freemitbbs_cardgamesauth_server_transition:
    path: /card-games/server/transition
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:transition }
    methods: [POST]

freemitbbs_cardgamesauth_server_game_transitions:
    path: /card-games/server/game-transitions
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:transition }
    methods: [POST]

freemitbbs_cardgamesauth_server_finished_summary:
    path: /card-games/server/finished-summary
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:finished_summary }
    methods: [POST]

freemitbbs_cardgamesauth_server_player_stats:
    path: /card-games/server/player-stats
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:player_stats }
    methods: [POST]

freemitbbs_cardgamesauth_server_player_settings_read:
    path: /card-games/server/player-settings/{game_type}/{user_id}
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:player_settings_read }
    requirements:
        game_type: '[A-Za-z0-9_-]+'
        user_id: \d+
    methods: [GET]

freemitbbs_cardgamesauth_server_player_settings_write:
    path: /card-games/server/player-settings
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:player_settings_write }
    methods: [POST]

freemitbbs_cardgamesauth_server_cleanup:
    path: /card-games/server/cleanup
    defaults: { _controller: freemitbbs.cardgamesauth.controller.server:cleanup }
    methods: [POST]
