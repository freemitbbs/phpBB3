freemitbbs_sitemap_index:
    path: /sitemap.xml
    defaults: { _controller: freemitbbs.sitemap.controller:index }

freemitbbs_sitemap_pages:
    path: /sitemap-pages.xml
    defaults: { _controller: freemitbbs.sitemap.controller:pages }

freemitbbs_sitemap_forums:
    path: /sitemap-forums.xml
    defaults: { _controller: freemitbbs.sitemap.controller:forums }

freemitbbs_sitemap_topics:
    path: /sitemap-topics-{page}.xml
    defaults: { _controller: freemitbbs.sitemap.controller:topics }
    requirements:
        page: \d+

freemitbbs_sitemap_blog:
    path: /sitemap-blog.xml
    defaults: { _controller: freemitbbs.sitemap.controller:blog }
