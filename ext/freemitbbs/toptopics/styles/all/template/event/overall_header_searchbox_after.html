<!-- IF S_TOPTOPICS_HEADER_PREFS -->
<div class="freemitbbs-header-prefs"
	data-header-prefs-url="{U_TOPTOPICS_HEADER_PREFS}"
	data-header-prefs-hash="{TOPTOPICS_HEADER_PREFS_HASH}"
	data-header-prefs-current-theme="{TOPTOPICS_HEADER_PREFS_CURRENT_THEME}"
	data-header-prefs-current-topic-list="{TOPTOPICS_HEADER_PREFS_CURRENT_TOPIC_LIST}"
	data-header-prefs-anonymous="<!-- IF S_TOPTOPICS_HEADER_PREFS_ANONYMOUS -->1<!-- ELSE -->0<!-- ENDIF -->"
	data-header-prefs-gold-style-id="{TOPTOPICS_HEADER_PREFS_GOLD_STYLE_ID}"
	data-header-prefs-cool-style-id="{TOPTOPICS_HEADER_PREFS_COOL_STYLE_ID}"
	data-header-prefs-gray-style-id="{TOPTOPICS_HEADER_PREFS_GRAY_STYLE_ID}"
	data-header-prefs-current-home-layout="{TOPTOPICS_HEADER_PREFS_CURRENT_HOME_LAYOUT}">
	<!-- IF S_TOPTOPICS_HEADER_PREFS_THEME -->
	<div class="freemitbbs-header-pref-group" aria-label="{L_TOPTOPICS_HEADER_THEME_TOGGLE}">
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_GOLD_ACTIVE --> active<!-- ENDIF -->" data-header-pref-theme="prosilver_fm" data-header-pref-style-id="{TOPTOPICS_HEADER_PREFS_GOLD_STYLE_ID}" title="{L_TOPTOPICS_HEADER_THEME_GOLD_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_THEME_GOLD_EXPLAIN}">{L_TOPTOPICS_HEADER_THEME_GOLD}</button>
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_COOL_ACTIVE --> active<!-- ENDIF -->" data-header-pref-theme="prosilver_fm_cool" data-header-pref-style-id="{TOPTOPICS_HEADER_PREFS_COOL_STYLE_ID}" title="{L_TOPTOPICS_HEADER_THEME_COOL_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_THEME_COOL_EXPLAIN}">{L_TOPTOPICS_HEADER_THEME_COOL}</button>
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_GRAY_ACTIVE --> active<!-- ENDIF -->" data-header-pref-theme="prosilver_se" data-header-pref-style-id="{TOPTOPICS_HEADER_PREFS_GRAY_STYLE_ID}" title="{L_TOPTOPICS_HEADER_THEME_GRAY_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_THEME_GRAY_EXPLAIN}">{L_TOPTOPICS_HEADER_THEME_GRAY}</button>
	</div>
	<!-- ENDIF -->
	<div class="freemitbbs-header-pref-group" aria-label="{L_TOPTOPICS_HEADER_TOPIC_LIST_TOGGLE}">
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_CLASSIC_ACTIVE --> active<!-- ENDIF -->" data-header-pref-topic-list="classic" title="{L_TOPTOPICS_HEADER_TOPIC_LIST_CLASSIC_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_TOPIC_LIST_CLASSIC_EXPLAIN}">{L_TOPTOPICS_HEADER_TOPIC_LIST_CLASSIC}</button>
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_ENHANCED_ACTIVE --> active<!-- ENDIF -->" data-header-pref-topic-list="enhanced" title="{L_TOPTOPICS_HEADER_TOPIC_LIST_ENHANCED_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_TOPIC_LIST_ENHANCED_EXPLAIN}">{L_TOPTOPICS_HEADER_TOPIC_LIST_ENHANCED}</button>
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_COMPACT_ACTIVE --> active<!-- ENDIF -->" data-header-pref-topic-list="compact" title="{L_TOPTOPICS_HEADER_TOPIC_LIST_COMPACT_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_TOPIC_LIST_COMPACT_EXPLAIN}">{L_TOPTOPICS_HEADER_TOPIC_LIST_COMPACT}</button>
	</div>
	<div class="freemitbbs-header-pref-group" aria-label="{L_TOPTOPICS_HEADER_HOME_LAYOUT_TOGGLE}">
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_SPLIT_ACTIVE --> active<!-- ENDIF -->" data-header-pref-home-layout="split" title="{L_TOPTOPICS_HEADER_HOME_LAYOUT_SPLIT_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_HOME_LAYOUT_SPLIT_EXPLAIN}">{L_TOPTOPICS_HEADER_HOME_LAYOUT_SPLIT}</button>
		<button type="button" class="freemitbbs-header-pref-toggle<!-- IF S_TOPTOPICS_HEADER_PREFS_MERGED_ACTIVE --> active<!-- ENDIF -->" data-header-pref-home-layout="merged" title="{L_TOPTOPICS_HEADER_HOME_LAYOUT_MERGED_EXPLAIN}" aria-label="{L_TOPTOPICS_HEADER_HOME_LAYOUT_MERGED_EXPLAIN}">{L_TOPTOPICS_HEADER_HOME_LAYOUT_MERGED}</button>
	</div>
</div>
<!-- ENDIF -->
